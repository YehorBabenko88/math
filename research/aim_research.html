<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Universe — AIM Research</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:850px;padding:0 1rem;background:#101827;color:#f1f5f9}textarea{width:100%;min-height:110px;box-sizing:border-box;background:#202c40;color:white;border:1px solid #64748b;border-radius:8px;padding:12px}button{padding:10px 18px;margin:12px 8px 12px 0;border:0;border-radius:8px;background:#93c5fd;color:#101827;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;background:#202c40;border-radius:8px}.note{color:#cbd5e1}</style>
<h1>Math Universe / AIM Research</h1>
<p class="note">Offline request composer. This page does not execute AIM, contact a server or verify proofs.</p>
<label for="problem">Mathematical research problem</label><textarea id="problem" maxlength="100000" placeholder="State a precise mathematical problem"></textarea>
<label for="context">Definitions, assumptions and context</label><textarea id="context" maxlength="100000"></textarea>
<div><button id="build">Prepare research request</button><button id="save" disabled>Download JSON</button></div>
<p id="status" role="status"></p><pre id="output" aria-live="polite"></pre>
<script type="module">
const $=id=>document.getElementById(id);let serialized='';
$('build').addEventListener('click',async()=>{
  const problem=$('problem').value,context=$('context').value;
  if(!problem.trim()){ $('status').textContent='Problem cannot be empty';return }
  if(problem.length>100000||context.length>100000){$('status').textContent='Input too long';return}
  const bytes=new TextEncoder().encode(problem+'\0'+context);
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
  serialized=JSON.stringify({schema:'math.aim.research.v1',problem,context,digest,status:'UNVERIFIED'},null,2);
  $('output').textContent=serialized;$('save').disabled=false;
  $('status').textContent='Research request prepared locally — UNVERIFIED';
});
$('save').addEventListener('click',()=>{
 if(!serialized)return;const url=URL.createObjectURL(new Blob([serialized],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='math-aim-request.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});
</script></html>
