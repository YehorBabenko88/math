name: Validate Math Universe
on:
  push:
  pull_request:
jobs:
  test:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'fix/pr70-g0-observation-integrity' && github.ref != 'refs/heads/fix/pr70-g0-observation-integrity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PROVENANCE_CONTEXT: 'test'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify tracked source before tests
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
        run: node scripts/verify-source-identity.mjs --before
      - name: Verify dependency artifact locks
        run: node scripts/verify-dependency-locks.mjs
      - name: Validate mandatory CI contract
        run: node --test tests/ci-coverage.test.mjs

      - name: Verify current evidence publication policy
        run: |
          node --test tests/evidence-publication.test.mjs tests/evidence-publication-surface.test.mjs
          node scripts/evidence-publication-policy.mjs

      - name: Record exact source and dependency provenance
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
          PROVENANCE_CONTEXT: 'test'
        run: node scripts/ci-provenance.mjs
      - name: Upload source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 30
