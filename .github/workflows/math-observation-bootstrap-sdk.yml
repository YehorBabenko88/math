name: Math Observation Bootstrap SDK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation-sdk:
    # Retain the dedicated no-native/no-Q01 branch's existing scope policy.
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Raw checkout and source/sdist/wheel refusal controls
        run: python -B -m unittest discover -s tests -p test_math_sdk_raw_bytes.py -v
      - name: Exact-head pure observation API and refusal cases
        run: python -B -m unittest discover -s tests -p test_observation_bootstrap_api.py -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          repository: YehorBabenko88/Terminan
          ref: d129840274f6a0faa1591a0ac3a5b92cc0bb5d88
          path: reference-terminan
          persist-credentials: false
      - name: Compare levels and footprint POC with pinned Terminan source
        run: python -B -m unittest discover -s tests -p test_terminan_math_parity.py -v
      - name: Verify Math SDK contains scientific code only
        run: python -B -m unittest discover -s tests -p test_math_sdk_ownership.py -v
      - name: Canonical Math namespace and exact raw numerical baseline
        run: python -B -c "import sys,unittest; sys.path.insert(0,'python'); s=unittest.defaultTestLoader.discover('tests',pattern='test_market_math_namespace.py'); r=unittest.TextTestRunner(verbosity=2).run(s); raise SystemExit(not r.wasSuccessful())"
      - name: Query grid and turnover numerical domains
        run: python -B -c "import sys,unittest; sys.path.insert(0,'python'); s=unittest.defaultTestLoader.discover('tests',pattern='test_query_numeric_kernels.py'); r=unittest.TextTestRunner(verbosity=2).run(s); assert r.testsRun==8 and not r.skipped; raise SystemExit(not r.wasSuccessful())"
      - name: Exact percent unit conversion
        run: python -B -c "import sys,unittest; sys.path.insert(0,'python'); s=unittest.defaultTestLoader.discover('tests',pattern='test_percent_fraction.py'); r=unittest.TextTestRunner(verbosity=2).run(s); assert r.testsRun==8 and not r.skipped; raise SystemExit(not r.wasSuccessful())"
      - name: Literal finite nonnegative numeric predicate
        run: python -B -c "import sys,unittest; sys.path.insert(0,'python'); s=unittest.defaultTestLoader.discover('tests',pattern='test_finite_nonnegative_number.py'); r=unittest.TextTestRunner(verbosity=2).run(s); assert r.testsRun==6 and not r.skipped and not r.expectedFailures and not r.unexpectedSuccesses; raise SystemExit(not r.wasSuccessful())"
      - name: Build and install standalone Math SDK from exact committed source
        shell: python {0}
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, tempfile, textwrap, venv, zipfile
          root=pathlib.Path.cwd()
          sys.path.insert(0,str(root/'scripts'))
          from math_sdk_source_bytes import verify_wheel,verify_sdist,require_checkout,materialize
          names=['pyproject.toml','python/market_compute_api.py',
                 'python/market_math.py','python/history_statistics.py']
          def call(args,**kwargs):
              subprocess.run([str(x) for x in args],check=True,timeout=120,**kwargs)
          with tempfile.TemporaryDirectory(prefix='math-observations-') as home:
              tmp=pathlib.Path(home)
              source=tmp/'source'
              committed_files={};current_files={}
              for name in names:
                  committed_files[name]=subprocess.check_output(['git','--no-replace-objects','-C',str(root),'show','HEAD:'+name],timeout=15)
                  current_files[name]=(root/name).read_bytes()
              require_checkout(committed_files,current_files)
              materialize(committed_files,source)
              numeric_cases=[]
              for case,test_name in (('volatility','tests/test_causal_volatility.py'),('value_area','tests/test_value_area_metrics.py'),('research_brackets','tests/test_research_bracket_prices.py'),('research_expansion','tests/test_research_expansion_side.py'),('price_structure','tests/test_price_structure_patterns.py'),('entry_numeric','tests/test_entry_numeric_policy.py'),('screening_numeric','tests/test_screening_numeric.py'),('profit_loss_numeric','tests/test_profit_loss_numeric.py'),('permutation_drawdowns','tests/test_permutation_drawdowns.py'),('paper_execution_values','tests/test_paper_execution_values.py'),('paper_scale_accounting','tests/test_paper_scale_accounting.py'),('historical_ohlc_directional_volume','tests/test_historical_ohlc_directional_volume.py')):
                  test_bytes=subprocess.check_output(['git','--no-replace-objects','-C',str(root),'show','HEAD:'+test_name],timeout=15)
                  if (root/test_name).read_bytes()!=test_bytes:raise RuntimeError('NUMERIC_TEST_RAW_CHECKOUT_MISMATCH')
                  test_home=tmp/(case+'-test');test_home.mkdir()
                  numeric_test=test_home/pathlib.PurePosixPath(test_name).name;numeric_test.write_bytes(test_bytes)
                  numeric_bindings=tmp/(case+'-bindings.json')
                  numeric_bindings.write_text(json.dumps({'sdk':{pathlib.PurePosixPath(name).name:hashlib.sha256(raw).hexdigest() for name,raw in committed_files.items() if name.startswith('python/')},'test_sha256':hashlib.sha256(test_bytes).hexdigest(),'case':case},sort_keys=True),encoding='utf-8')
                  numeric_cases.append((case,numeric_test,numeric_bindings))
              volatility_program=textwrap.dedent(r'''
              import hashlib,importlib,importlib.util,importlib.machinery,json,pathlib,stat,sys,unittest
              SDK=('market_math','market_compute_api','history_statistics')
              TEST_MODULE='math_numeric_ci_tests'
              CASES={'volatility':(11,'test_causal_volatility.py','MATH_CAUSAL_VOLATILITY'),'value_area':(25,'test_value_area_metrics.py','MATH_VALUE_AREA'),'research_brackets':(16,'test_research_bracket_prices.py','MATH_RESEARCH_BRACKETS'),'research_expansion':(9,'test_research_expansion_side.py','MATH_RESEARCH_EXPANSION'),'price_structure':(12,'test_price_structure_patterns.py','MATH_PRICE_STRUCTURE'),'entry_numeric':(17,'test_entry_numeric_policy.py','MATH_ENTRY_NUMERIC'),'screening_numeric':(25,'test_screening_numeric.py','MATH_SCREENING_NUMERIC'),'profit_loss_numeric':(22,'test_profit_loss_numeric.py','MATH_PROFIT_LOSS_NUMERIC'),'permutation_drawdowns':(14,'test_permutation_drawdowns.py','MATH_PERMUTATION_DRAWDOWNS'),'paper_execution_values':(10,'test_paper_execution_values.py','MATH_PAPER_EXECUTION_VALUES'),'paper_scale_accounting':(25,'test_paper_scale_accounting.py','MATH_PAPER_SCALE_ACCOUNTING'),'historical_ohlc_directional_volume':(6,'test_historical_ohlc_directional_volume.py','MATH_HISTORICAL_OHLC_DIRECTIONAL_VOLUME')}
              FORBIDDEN=('market_profile_math','market_data','terminan','grid','strattester','meta_analyse')
              def need(value,code):
                  if not value:raise RuntimeError(code)
              def owned(name):
                  return name==TEST_MODULE or any(name==item or name.startswith(item+'.') for item in SDK+FORBIDDEN)
              def ordinary_directory(path):
                  for item in (path,*path.parents):
                      info=item.lstat()
                      need(stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode) and not getattr(info,'st_file_attributes',0)&1024,'VOLATILITY_ORDINARY_DIRECTORY_REQUIRED')
              def claim_cache(cache,sdk,container,checkout,test):
                  need(sys.flags.isolated and sys.flags.no_site and sys.flags.dont_write_bytecode and sys.dont_write_bytecode,'VOLATILITY_REAL_ISOLATED_FLAGS_REQUIRED')
                  need(not any(owned(name) for name in sys.modules),'VOLATILITY_PRELOADED_SDK_REJECTED')
                  need(cache.is_absolute() and '..' not in cache.parts and sys.pycache_prefix is not None,'VOLATILITY_CLI_CACHE_REQUIRED')
                  need('pycache_prefix' in sys._xoptions and pathlib.Path(sys._xoptions['pycache_prefix'])==cache and pathlib.Path(sys.pycache_prefix)==cache,'VOLATILITY_CLI_CACHE_REQUIRED')
                  for root in (sdk,container,checkout,test.parent):
                      need(not cache.resolve().is_relative_to(root.resolve()),'VOLATILITY_EXTERNAL_CACHE_REQUIRED')
                  ordinary_directory(cache.parent)
                  cache.mkdir()
                  info=cache.lstat()
                  return (info.st_dev,info.st_ino)
              def cache_unchanged(cache,identity):
                  info=cache.lstat()
                  need(stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode) and not getattr(info,'st_file_attributes',0)&1024 and (info.st_dev,info.st_ino)==identity and not any(cache.iterdir()),'VOLATILITY_CACHE_CHANGED')
              def snapshot(paths,expected):
                  records={}
                  for key,path in paths.items():
                      info=path.lstat()
                      need(stat.S_ISREG(info.st_mode) and not stat.S_ISLNK(info.st_mode) and not getattr(info,'st_file_attributes',0)&1024 and info.st_nlink==1 and 0<info.st_size<=2097152,'VOLATILITY_ORDINARY_SOURCE_REQUIRED')
                      raw=path.read_bytes()
                      need(len(raw)==info.st_size and hashlib.sha256(raw).hexdigest()==expected[key],'VOLATILITY_COMMITTED_BYTES_MISMATCH')
                      records[key]=(info.st_dev,info.st_ino,info.st_size,info.st_mtime_ns)
                  return records
              def loaded_origins(sdk,test,cache):
                  expected={name:sdk/(name+'.py') for name in SDK};expected[TEST_MODULE]=test
                  need({name for name in sys.modules if owned(name)}==set(expected),'VOLATILITY_EXACT_MODULE_ROSTER_REQUIRED')
                  for name,path in expected.items():
                      module=sys.modules[name]
                      declared_source=pathlib.Path(module.__file__)
                      need(declared_source.is_absolute(),'VOLATILITY_MODULE_ORIGIN_MISMATCH')
                      source=declared_source.resolve(strict=True)
                      need(source==path.resolve(strict=True) and module.__spec__ is not None and pathlib.Path(module.__spec__.origin).resolve(strict=True)==source,'VOLATILITY_MODULE_ORIGIN_MISMATCH')
                      loader=module.__spec__.loader
                      need(type(loader) is importlib.machinery.SourceFileLoader and getattr(module,'__loader__',None) is loader and type(loader.name) is str and loader.name==name and type(loader.path) is str and pathlib.Path(loader.path).is_absolute() and pathlib.Path(loader.path).resolve(strict=True)==source,'VOLATILITY_SOURCE_LOADER_MISMATCH')
                      calculated=pathlib.Path(importlib.util.cache_from_source(str(declared_source)))
                      need(pathlib.Path(module.__cached__)==calculated and calculated.is_relative_to(cache),'VOLATILITY_CACHED_ORIGIN_MISMATCH')
              def accepted(result,case_count):
                  return result.wasSuccessful() and result.testsRun==case_count and not result.skipped and not result.expectedFailures and not result.unexpectedSuccesses
              def main():
                  need(len(sys.argv)==8,'VOLATILITY_FIXED_ARGUMENTS_REQUIRED')
                  sdk,test,bindings,cache,container,checkout=map(pathlib.Path,sys.argv[1:7]);mode=sys.argv[7]
                  need(mode in ('source','wheel') and all(path.is_absolute() for path in (sdk,test,bindings,cache,container,checkout)),'VOLATILITY_FIXED_SCOPE_REQUIRED')
                  ordinary_directory(sdk);ordinary_directory(test.parent)
                  identity=claim_cache(cache,sdk,container,checkout,test)
                  manifest=json.loads(bindings.read_text(encoding='utf-8'))
                  need(type(manifest) is dict and set(manifest)=={'sdk','test_sha256','case'} and type(manifest['sdk']) is dict and set(manifest['sdk'])=={name+'.py' for name in SDK},'VOLATILITY_EXACT_BINDINGS_REQUIRED')
                  case=manifest['case'];need(type(case) is str and case in CASES,'NUMERIC_CLOSED_CASE_REQUIRED')
                  case_count,test_name,label=CASES[case];need(test.name==test_name,'NUMERIC_CASE_TEST_BINDING_REQUIRED')
                  paths={name+'.py':sdk/(name+'.py') for name in SDK};paths['test']=test
                  expected=dict(manifest['sdk']);expected['test']=manifest['test_sha256']
                  before=snapshot(paths,expected);cache_unchanged(cache,identity)
                  def deny(event,args):
                      if event.startswith(('socket.','subprocess.','ctypes.')) or event in ('os.system','os.startfile','os.fork','os.kill','sqlite3.connect'):raise RuntimeError('VOLATILITY_PURE_NUMERIC_EFFECT_REQUIRED')
                  sys.addaudithook(deny);sys.path.insert(0,str(sdk))
                  need(all(importlib.util.find_spec(name) is None for name in FORBIDDEN),'VOLATILITY_AMBIENT_SDK_VISIBLE')
                  for name in SDK:importlib.import_module(name)
                  spec=importlib.util.spec_from_file_location(TEST_MODULE,test)
                  module=importlib.util.module_from_spec(spec);sys.modules[TEST_MODULE]=module;spec.loader.exec_module(module)
                  loaded_origins(sdk,test,cache);cache_unchanged(cache,identity)
                  suite=unittest.defaultTestLoader.loadTestsFromModule(module)
                  need(suite.countTestCases()==case_count,'NUMERIC_EXACT_CASE_ROSTER_REQUIRED')
                  result=unittest.TextTestRunner(verbosity=2).run(suite)
                  need(snapshot(paths,expected)==before,'VOLATILITY_INPUT_IDENTITY_CHANGED')
                  loaded_origins(sdk,test,cache);cache_unchanged(cache,identity)
                  need(accepted(result,case_count),'VOLATILITY_NONPASS_CASE')
                  print(label+'_'+mode.upper()+'='+str(case_count)+'_PASS;SCOPE_PURE_NUMERIC_ONLY')
              main()
              ''')
              for case,numeric_test,numeric_bindings in numeric_cases:
                  cache=tmp/(case+'-source-cache')
                  call([sys.executable,'-I','-S','-B','-X','pycache_prefix='+str(cache),'-c',volatility_program,source/'python',numeric_test,numeric_bindings,cache,source,root,'source'],cwd=tmp)
              # Use the same pinned builder on Linux and Windows; never
              # silently change metadata or skip the Python 3.11 job.
              builder=tmp/'builder'
              venv.EnvBuilder(with_pip=True).create(builder)
              executable='Scripts/python.exe' if os.name=='nt' else 'bin/python'
              build_python=builder/executable
              call([build_python,'-m','pip','install','--no-deps',
                    '--only-binary=:all:','setuptools==80.9.0'])
              wheels=tmp/'wheels'
              wheels.mkdir()
              env={**os.environ,'SOURCE_DATE_EPOCH':'315532800'}
              call([build_python,'-m','pip','wheel','--no-deps',
                    '--no-build-isolation','--wheel-dir',wheels,source],env=env)
              files=list(wheels.glob('unified_math_kernels-*.whl'))
              if len(files)!=1:
                  raise RuntimeError('MATH_OBSERVATION_WHEEL_COUNT')
              with zipfile.ZipFile(files[0]) as wheel:
                  if 'market_profile_math.py' in wheel.namelist():
                      raise RuntimeError('RETIRED_MATH_MODULE_IN_WHEEL')
                  for name in names:
                      if not name.startswith('python/'):
                          continue
                      module=pathlib.PurePosixPath(name).name
                      if wheel.read(module)!=(source/name).read_bytes():
                          raise RuntimeError('MATH_WHEEL_SOURCE_MISMATCH:'+module)
              verify_wheel(files[0],committed_files)
              sdists=tmp/'sdists';sdists.mkdir()
              call([build_python,'-I','-B','-c','from setuptools.build_meta import build_sdist;import sys;build_sdist(sys.argv[1])',sdists],cwd=source,env=env)
              archives=list(sdists.glob('*.tar.gz'))
              if len(archives)!=1:raise RuntimeError('MATH_SDK_SDIST_COUNT')
              verify_sdist(archives[0],committed_files)
              installed=tmp/'installed'
              venv.EnvBuilder(with_pip=True).create(installed)
              py=installed/executable
              call([py,'-m','pip','install','--no-index','--no-deps',files[0]])
              program=("import importlib.metadata as m,importlib.util,pathlib;"
                       "import market_math as canonical;"
                       "from decimal import Decimal,Inexact,getcontext;"
                       "from market_compute_api import OBSERVATION_BOOTSTRAP_REQUEST,"
                       "STREAM_ABI,TIMEFRAME_LEVELS_ABI,aggregate_orderflow_stream,"
                       "compute_observation_bootstrap,price_bucket,untouched_timeframe_levels;"
                       "import history_statistics as h;"
                       "dist=m.distribution('unified-math-kernels');"
                       "assert dist.version=='0.1.0';"
                       "assert dist.metadata['Requires-Python']=='>=3.11';"
                       "assert not dist.requires;"
                       "assert importlib.util.find_spec('market_profile_math') is None;"
                       "assert pathlib.Path(canonical.__file__).resolve()==pathlib.Path(dist.locate_file('market_math.py')).resolve();"
                       "assert {p.name for p in dist.files if p.suffix=='.py'}=="
                       "{'market_compute_api.py','market_math.py','history_statistics.py'};"
                       "assert TIMEFRAME_LEVELS_ABI=='math.market.levels.binary64.v1';"
                       "levels=untouched_timeframe_levels([{'t':0,'h':2,'l':1}],'1h',3600000);"
                       "assert [level['price'] for level in levels]==[2.0,1.0];"
                       "assert STREAM_ABI=='math.market.orderflow.stream.v1';"
                       "rows=((i,Decimal('100'),Decimal('0.01'),'buy') for i in range(100_000));"
                       "buckets=aggregate_orderflow_stream(rows,mode='time',interval_ms=60_000);"
                       "assert sum(m['trade_count'] for _,m in buckets)==100_000;"
                       "assert sum(m['buy_volume'] for _,m in buckets)==Decimal('1000');"
                       "assert callable(h.paired_observation_bootstrap);"
                       "q={'schema':OBSERVATION_BOOTSTRAP_REQUEST,"
                       "'execution_authority':False,"
                       "'source':{'snapshot_sha256':'a'*64,'as_of_ms':1,"
                       "'unit':'dimensionless'},"
                       "'analysis':{'method':'paired','runs':8,'seed':17,"
                       "'base':[{'id':'a','value':1.0},{'id':'b','value':2.0}],"
                       "'variant':[{'id':'a','value':1.25},"
                       "{'id':'b','value':2.25}]}};"
                       "r=compute_observation_bootstrap(q);"
                       "assert r['result']['delta_mean']==0.25;"
                       "assert r['provenance']=='CALLER_SUPPLIED_UNATTESTED';"
                       "assert r['trading_authorized'] is False;"
                       "assert r['execution_authority'] is False;"
                       "getcontext().prec=5;"
                       "getcontext().traps[Inexact]=True;"
                       "assert price_bucket(Decimal('100.005'),Decimal('0.01'))==Decimal('100.01');"
                       "assert price_bucket(Decimal('12345.675'),Decimal('0.01'))==Decimal('12345.68')")
              call([py,'-I','-B','-c',program],cwd=tmp)
              # The same precision/trap/100k distribution tests exercise only
              # the installed wheel: -I excludes checkout/PYTHONPATH imports.
              call([py,'-I','-B',root/'tests/test_market_math_namespace.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_causal_paper_math.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_paper_quote_book_domain.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_paper_quote_funding_domain.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_orderflow_decimal_context.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_market_analytics_contract.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_historical_aggregate_integrity.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_history_window_ms.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_query_numeric_kernels.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_percent_fraction.py'],cwd=tmp)
              call([py,'-I','-B',root/'tests/test_finite_nonnegative_number.py'],cwd=tmp)
              # -S on3.11 resets venv sys.prefix: derive this venv's actual purelib explicitly.
              purelib=installed/('Lib/site-packages' if os.name=='nt' else 'lib/python'+str(sys.version_info.major)+'.'+str(sys.version_info.minor)+'/site-packages')
              for case,numeric_test,numeric_bindings in numeric_cases:
                  cache=tmp/(case+'-wheel-cache')
                  call([py,'-I','-S','-B','-X','pycache_prefix='+str(cache),'-c',volatility_program,purelib,numeric_test,numeric_bindings,cache,installed,root,'wheel'],cwd=tmp)
              print('MATH_OBSERVATION_WHEEL_INSTALLED=PASS')
              print('MATH_OBSERVATION_WHEEL_SHA256='+hashlib.sha256(files[0].read_bytes()).hexdigest())
