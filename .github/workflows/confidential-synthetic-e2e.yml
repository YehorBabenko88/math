name: Synthetic Confidential Hosted Qualification
on:
  pull_request:
    paths:
      - 'src/evidence-receiver/**'
      - 'src/confidential-collector/**'
      - 'scripts/confidential-qualification/**'
      - 'tests/confidential-*.test.mjs'
      - '.github/workflows/confidential-collector.yml'
      - '.github/workflows/confidential-synthetic-e2e.yml'
permissions:
  contents: read
jobs:
  qualification:
    if: github.head_ref != 'integration/pr69-g0-readiness' && github.repository == 'YehorBabenko88/math' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    uses: YehorBabenko88/math/.github/workflows/confidential-collector.yml@4da26a3c83fb6adea4f83a9a58fb90c0cc4a3195
    with:
      collector-sha: 4da26a3c83fb6adea4f83a9a58fb90c0cc4a3195
