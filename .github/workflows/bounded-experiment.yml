name: bounded-math-experiment
on: [push, pull_request]
jobs:
  bounded:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test tests/bounded-experiment.test.mjs tests/math-engine-server.test.mjs
      - shell: pwsh
        run: |
          $receipt = @{schema='five.ci.v1'; head=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); run='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'; source='DISPOSABLE_SOFTWARE_TEST'; physical='NOT_RUN'; production='NO_GO'}
          $receipt | ConvertTo-Json | Set-Content five-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-math-${{ matrix.os }}
          path: five-evidence.json
