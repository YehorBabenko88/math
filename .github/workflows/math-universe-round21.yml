name: Math Universe Round21
on:
  push:
    branches: [math-universe/r21-codex-integration]
  pull_request:
    branches: [main, math-universe/r19-master-x8-dev]
permissions:
  contents: read
jobs:
  components:
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Exact-source scoped Node components (PG live in separate job)
        run: node scripts/round21-node-tests.mjs
      - name: Unique Python components and independent mathematical references
        run: python -I -B scripts/round21-tests.py
      - name: Native CPU wall and RSS measurements (logical budgets separate)
        run: python -I -B scripts/benchmark-round21.py
  postgres18:
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: scientific_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d scientific_memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCIENTIFIC_MEMORY_TEST_DSN: postgresql://lab:disposable-ci-only@127.0.0.1:5432/scientific_memory_test
      MATH_EXPERIMENT_OWNER_URL: postgresql://math_experiment_owner:disposable-ci-only@127.0.0.1:5432/math_experiment_test
      MATH_EXPERIMENT_HOST_URL: postgresql://math_experiment_host:disposable-ci-only@127.0.0.1:5432/math_experiment_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install 'psycopg[binary]==3.3.6'
      - name: Provision roles only inside disposable service
        env:
          PGPASSWORD: disposable-ci-only
        run: |
          psql -h 127.0.0.1 -U lab -d scientific_memory_test -v ON_ERROR_STOP=1 -c "CREATE ROLE math_experiment_owner LOGIN PASSWORD 'disposable-ci-only'; CREATE ROLE math_experiment_host LOGIN PASSWORD 'disposable-ci-only';"
          psql -h 127.0.0.1 -U lab -d scientific_memory_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE math_experiment_test OWNER math_experiment_owner;'
      - name: Transactional scientific memory on actual PostgreSQL18
        run: python -I -B tests/scientific_memory_postgres.py
      - name: Exact-source experiment and component tests with actual PostgreSQL18
        run: node scripts/round21-node-tests.mjs --live
