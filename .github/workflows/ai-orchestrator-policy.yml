name: AI Orchestrator Policy (offline)
on:
  push:
    paths:
      - 'src/ai-orchestrator/**'
      - 'tests/ai-orchestrator-*.test.mjs'
      - '.github/workflows/ai-orchestrator-policy.yml'
  pull_request:
    paths:
      - 'src/ai-orchestrator/**'
      - 'tests/ai-orchestrator-*.test.mjs'
      - '.github/workflows/ai-orchestrator-policy.yml'
permissions:
  contents: read
jobs:
  offline-policy:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'fix/pr64-hosted-failure' && github.ref != 'refs/heads/fix/pr64-hosted-failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Run offline orchestrator tests
        run: node --test --test-reporter=spec tests/ai-orchestrator-*.test.mjs
