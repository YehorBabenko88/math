name: Experimental Proof Kernel
on:
  pull_request:
    paths:
      - 'src/proof-kernel.mjs'
      - 'tests/proof-kernel.test.mjs'
      - 'tests/proof-kernel-independent-property.test.mjs'
      - '.github/workflows/proof-kernel-isolated.yml'
  push:
    paths:
      - 'src/proof-kernel.mjs'
      - 'tests/proof-kernel.test.mjs'
      - 'tests/proof-kernel-independent-property.test.mjs'
      - '.github/workflows/proof-kernel-isolated.yml'
permissions:
  contents: read
jobs:
  isolated-proof-kernel:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'feat/g0-structured-token' && github.ref != 'refs/heads/feat/g0-structured-token' }}
    name: Proof kernel Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Run isolated proof-kernel tests
        run: node --test tests/proof-kernel.test.mjs tests/proof-kernel-independent-property.test.mjs
