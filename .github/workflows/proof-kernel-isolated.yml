name: Experimental Proof Kernel
on:
  pull_request:
    paths:
      - 'src/proof-kernel.mjs'
      - 'tests/proof-kernel.test.mjs'
      - '.github/workflows/proof-kernel-isolated.yml'
  push:
    paths:
      - 'src/proof-kernel.mjs'
      - 'tests/proof-kernel.test.mjs'
      - '.github/workflows/proof-kernel-isolated.yml'
permissions:
  contents: read
jobs:
  isolated-proof-kernel:
    name: Proof kernel Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run isolated proof-kernel tests
        run: node --test tests/proof-kernel.test.mjs
