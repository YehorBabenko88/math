name: Q01 Native Forensics
on:
  push:
    branches: [test/q01-native-forensics-20]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensics:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/q01-evidence.test.mjs tests/q01-runner.test.mjs
      - run: node scripts/q01-lab/run.mjs --source "${{ github.workspace }}" --output "${{ runner.temp }}/MathUniverseQ01/forensic" --expected-head "${{ github.sha }}" --profile forensic
      - if: always()
        run: node scripts/q01-lab/verify.mjs --directory "${{ runner.temp }}/MathUniverseQ01/forensic/evidence" --expected-head "${{ github.sha }}" --expected-profile forensic
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forensic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/MathUniverseQ01/forensic/evidence/
          if-no-files-found: error
          retention-days: 30
