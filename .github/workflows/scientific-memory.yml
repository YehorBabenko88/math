name: Scientific Memory qualification
on:
  push:
    paths:
      - .github/workflows/scientific-memory.yml
      - 'python/scientific_memory.*'
      - python/history_statistics.py
      - python/history_timeseries.py
      - 'tests/*scientific_memory*.py'
  pull_request:
    paths:
      - .github/workflows/scientific-memory.yml
      - 'python/scientific_memory.*'
      - python/history_statistics.py
      - python/history_timeseries.py
      - 'tests/*scientific_memory*.py'
permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p test_scientific_memory.py -v

  postgres-18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: memory_test
          POSTGRES_PASSWORD: memory_fixture_only
          POSTGRES_DB: scientific_memory_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U memory_test -d scientific_memory_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: python
      SCIENTIFIC_MEMORY_TEST_DSN: postgresql://memory_test:memory_fixture_only@127.0.0.1:5432/scientific_memory_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: 'psycopg[binary]==3.3.6'
      - run: python -B tests/scientific_memory_postgres.py -v
