name: Windows Deployment Contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned fixture framework
        shell: pwsh
        run: Save-Module Pester -RequiredVersion 3.4.0 -Path "$env:RUNNER_TEMP/pester" -Force
      - name: Parse scripts and run synthetic deployment fixtures
        shell: ${{ matrix.shell }}
        run: |
          Import-Module "$env:RUNNER_TEMP/pester/Pester/3.4.0/Pester.psd1" -ErrorAction Stop
          Invoke-Pester -Script tests/windows-deployment.Tests.ps1 -EnableExit
