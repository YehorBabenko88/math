name: AIM research bridge
on:
  push:
    paths:
      - 'research/**'
      - 'tests/test_aim_bridge.py'
      - '.github/workflows/aim-research.yml'
  pull_request:
    paths:
      - 'research/**'
      - 'tests/test_aim_bridge.py'
      - '.github/workflows/aim-research.yml'
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and unit tests
        run: |
          python -m py_compile research/aim_bridge.py
          python -m unittest discover -s tests -p test_aim_bridge.py -v
