name: PostgreSQL Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    name: Full suite Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['16', '18']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: math_universe_test
          POSTGRES_USER: math_test
          POSTGRES_PASSWORD: math_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U math_test -d math_universe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROVENANCE_CONTEXT: 'Full suite Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}'
      BOOK_INGESTION_PYTHON: python
      MATH_UNIVERSE_TEST_DATABASE_URL: postgres://math_test:math_test_ci_only@127.0.0.1:5432/math_universe_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify tracked source before tests
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
        run: node scripts/verify-source-identity.mjs --before
      - name: Verify dependency artifact locks
        run: node scripts/verify-dependency-locks.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify committed SQL checkout bytes
        run: node scripts/verify-sql-bytes.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/book-ingestion-requirements.txt'
      - name: Root unit coverage refusal controls (inert only)
        run: node --permission --allow-fs-read=* tests/root-unit-coverage.unit.mjs
      - name: Bounded event/progress streaming controls (fake callbacks only)
        run: node --test tests/math-ci-stream-evidence.unit.mjs
      - name: Complete Linux-owned and cross-platform suite (zero skips or todo)
        env:
          P1_ORACLE_PYTHON: python
        run: node scripts/test-full-ci.mjs
      - name: Record exact source and dependency provenance
        if: always()
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
          PROVENANCE_CONTEXT: 'Full suite Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}'
        run: node scripts/ci-provenance.mjs
      - name: Upload source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}-postgres-${{ matrix.node }}-${{ matrix.postgres }}
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload mandatory platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-linux-${{ matrix.node }}-${{ matrix.postgres }}
          path: |
            platform-evidence/
            release-provenance.json
          if-no-files-found: error
          retention-days: 30
  windows-platform:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    name: Windows platform Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PROVENANCE_CONTEXT: 'Windows platform Node ${{ matrix.node }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Use exact committed LF bytes for mechanical assertion proof
        shell: pwsh
        run: |
          node scripts/prepare-exact-checkout.mjs --expected-head '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify tracked source before tests
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
        run: node scripts/verify-source-identity.mjs --before
      - name: Verify dependency artifact locks
        run: node scripts/verify-dependency-locks.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete Windows-owned and cross-platform suite (zero skips or todo)
        env:
          P1_ORACLE_PYTHON: python
        run: node scripts/test-full-ci.mjs
      - name: Record exact source and dependency provenance
        if: always()
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
        run: node scripts/ci-provenance.mjs
      - name: Upload Windows mandatory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-windows-${{ matrix.node }}
          path: |
            platform-evidence/
            release-provenance.json
          if-no-files-found: error
          retention-days: 30
  root-transferred-unit-roles:
    if: ${{ github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    uses: YehorBabenko88/unified-system/.github/workflows/ci-evidence-role-matrix.yml@802e78640adc0af6f1c5e04b37fa0f41b70b6a45
    permissions:
      contents: read
      actions: read
    with:
      matrix-sha: 802e78640adc0af6f1c5e04b37fa0f41b70b6a45
  full-ci-coverage:
    name: Full CI coverage
    permissions:
      contents: read
      actions: read
    if: ${{ (always()) && github.head_ref != 'fix/walk-forward-forecast-guard' && github.ref != 'refs/heads/fix/walk-forward-forecast-guard' }}
    needs: [postgres-integration, windows-platform, root-transferred-unit-roles]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare private pinned Root unit source
        id: root_unit_source
        run: |
          node --input-type=module <<'ROOT_UNIT_SOURCE'
          import{mkdtempSync,lstatSync,appendFileSync,realpathSync}from'node:fs';import{join,basename,dirname,isAbsolute}from'node:path';
          if(process.platform!=='linux'||process.env.GITHUB_ACTIONS!=='true'||process.env.RUNNER_ENVIRONMENT!=='github-hosted'||process.env.GITHUB_REPOSITORY!=='YehorBabenko88/math'||['NODE_OPTIONS','NODE_PATH','NODE_DEBUG','NODE_DEBUG_NATIVE'].some(k=>process.env[k]))throw Error('ROOT_UNIT_SOURCE_REFUSED');
          const workspace=realpathSync(process.env.GITHUB_WORKSPACE);for(let p=workspace;;p=dirname(p)){const s=lstatSync(p);if(!s.isDirectory()||s.isSymbolicLink())throw Error('ROOT_UNIT_SOURCE_REFUSED');if(dirname(p)===p)break;}
          if(!isAbsolute(process.env.GITHUB_OUTPUT)||/[\r\n\0]/.test(workspace+process.env.GITHUB_OUTPUT))throw Error('ROOT_UNIT_SOURCE_REFUSED');
          const parent=mkdtempSync(join(workspace,'.root-unit-source-'));
          if((lstatSync(parent).mode&0o077)!==0)throw Error('ROOT_UNIT_SOURCE_REFUSED');
          appendFileSync(process.env.GITHUB_OUTPUT,'path='+basename(parent)+'/root\nabsolute='+join(parent,'root')+'\n');
          ROOT_UNIT_SOURCE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: YehorBabenko88/unified-system
          ref: 802e78640adc0af6f1c5e04b37fa0f41b70b6a45
          path: ${{ steps.root_unit_source.outputs.path }}
          persist-credentials: false
          fetch-depth: 1
          set-safe-directory: false
          submodules: false
          lfs: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: platform-*
          path: mandatory-platform-artifacts
      - name: Require every matrix cell to succeed
        env:
          MATRIX_RESULT: ${{ needs.postgres-integration.result }}
          WINDOWS_RESULT: ${{ needs.windows-platform.result }}
        run: test "$MATRIX_RESULT" = success
      - name: Require Windows cells and verify actual identity union
        env:
          WINDOWS_RESULT: ${{ needs.windows-platform.result }}
          ROOT_MATRIX_RESULT: ${{ needs.root-transferred-unit-roles.result }}
          ROOT_UNIT_CHECKOUT: ${{ steps.root_unit_source.outputs.absolute }}
          ROOT_WORKLOAD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ROOT_PR_NUMBER: ${{ github.event.pull_request.number }}
          ROOT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          ROOT_UNIT_API_TOKEN: ${{ github.token }}
        run: |
          test "$WINDOWS_RESULT" = success
          node scripts/verify-platform-coverage.mjs mandatory-platform-artifacts

      - name: Upload independently verified identity union
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mandatory-platform-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: mandatory-platform-coverage.json
          if-no-files-found: error
          retention-days: 30
