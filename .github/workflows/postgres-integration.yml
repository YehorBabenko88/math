name: PostgreSQL Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: Full suite Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        postgres: ['16', '18']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: math_universe_test
          POSTGRES_USER: math_test
          POSTGRES_PASSWORD: math_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U math_test -d math_universe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOOK_INGESTION_PYTHON: python
      MATH_UNIVERSE_TEST_DATABASE_URL: postgres://math_test:math_test_ci_only@127.0.0.1:5432/math_universe_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify dependency artifact locks
        run: node scripts/verify-dependency-locks.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/book-ingestion-requirements.txt'
      - name: Full unfiltered suite (zero skips or todo)
        run: node scripts/test-full-ci.mjs
  full-ci-coverage:
    name: Full CI coverage
    if: always()
    needs: [postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix cell to succeed
        env:
          MATRIX_RESULT: ${{ needs.postgres-integration.result }}
        run: test "$MATRIX_RESULT" = success
