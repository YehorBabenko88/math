name: Q01 Detached Journal Regression
on:
  push:
    branches: [fix/q01-detached-journal-stat-20]
  pull_request:
    paths:
      - 'src/book-ingestion/queue.mjs'
      - 'tests/book-queue-detached-journal.test.mjs'
      - 'tests/helpers/detached-journal-*.mjs'
      - '.github/workflows/q01-detached-journal.yml'
permissions:
  contents: read
jobs:
  detached-journal:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'fix/pr70-g0-observation-integrity' && github.ref != 'refs/heads/fix/pr70-g0-observation-integrity' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/book-queue-detached-journal.test.mjs
