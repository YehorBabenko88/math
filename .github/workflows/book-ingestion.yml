name: Book Ingestion Native PDF

on:
  push:
    branches: [feat/book-knowledge-ingestion, feat/book-postgres-integration-test, feat/book-postgres-backend]
    paths:
      - 'src/book-ingestion/**'
      - 'scripts/book-ingestion*'
      - 'tests/book-ingestion*'
      - 'docs/book-ingestion*'
      - '.github/workflows/book-ingestion.yml'
  pull_request:
    paths:
      - 'src/book-ingestion/**'
      - 'scripts/book-ingestion*'
      - 'tests/book-ingestion*'
      - 'docs/book-ingestion*'
      - '.github/workflows/book-ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PDF test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/book-ingestion-requirements.txt
      - name: Verify synthetic PDF ingestion and review boundaries
        env:
          BOOK_INGESTION_PYTHON: python
        run: node --test tests/book-ingestion*.test.mjs
