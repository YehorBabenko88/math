name: Book Ingestion Native PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pdf:
    # User-scoped synthetic branch: unrelated suites are NOT_RUN, never qualification PASS.
    if: ${{ github.head_ref != 'integration/pr69-g0-readiness' && github.ref != 'refs/heads/integration/pr69-g0-readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROVENANCE_CONTEXT: 'native-pdf'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify tracked source before tests
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
        run: node scripts/verify-source-identity.mjs --before
      - name: Verify dependency artifact locks
        run: node scripts/verify-dependency-locks.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated PDF test dependencies
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/book-ingestion-requirements.txt'
      - name: Verify synthetic PDF ingestion and review boundaries
        env:
          BOOK_INGESTION_PYTHON: python
        run: node --test tests/book-ingestion*.test.mjs tests/book-sqlite-text.test.mjs

      - name: Record exact source and dependency provenance
        env:
          SOURCE_IDENTITY_RECEIPT: ${{ runner.temp }}/math-source-before.json
          PROVENANCE_CONTEXT: 'native-pdf'
        run: node scripts/ci-provenance.mjs
      - name: Upload source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}-native-pdf
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 30
