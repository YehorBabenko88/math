name: Book Ingestion Native PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated PDF test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/book-ingestion-requirements.txt
      - name: Verify synthetic PDF ingestion and review boundaries
        env:
          BOOK_INGESTION_PYTHON: python
        run: node --test tests/book-ingestion*.test.mjs tests/book-sqlite-text.test.mjs

      - name: Record exact source and dependency provenance
        env:
          PROVENANCE_CONTEXT: 'native-pdf'
        run: node scripts/ci-provenance.mjs
      - name: Upload source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-provenance-${{ github.run_id }}-${{ github.run_attempt }}-native-pdf
          path: release-provenance.json
          if-no-files-found: error
          retention-days: 30
